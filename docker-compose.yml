services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fitness_admin
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness_admin -d fitness"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./backend
    # exec 让 uvicorn 顶替 shell 成为 PID 1。不加 exec 时 sh 是 PID 1，而它
    # 不会把 SIGTERM 转发给子进程——docker stop 等满宽限期后发 SIGKILL，
    # 退出码 137，正在处理的请求被硬切。
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fitness_app:fitness@postgres:5432/fitness
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # SSE 长连接与 Agent 回合都可能跑十几秒，给足收尾时间。
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    command: python -m app.core.jobs.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://fitness_app:fitness@postgres:5432/fitness
      WORKER_DATABASE_URL: postgresql+asyncpg://fitness_worker:fitness_worker@postgres:5432/fitness
    env_file: .env
    depends_on:
      server:
        condition: service_healthy
    # worker 收到 SIGTERM 后会跑完手上这批任务再退。一批最多 10 条，
    # 单条最慢是待办抽取（一次抽取 + 最多 9 次判定），留足余量。
    stop_grace_period: 60s

  web:
    build:
      context: ./web
      args:
        # Next.js 会在构建时把这个值写进浏览器端代码。
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
