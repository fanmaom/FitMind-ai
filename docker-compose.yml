services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports:
      - "5433:5432"          # 宿主机 5433，避开本机已有的 Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://fitness:fitness@postgres:5432/fitness
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.core.jobs.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://fitness:fitness@postgres:5432/fitness
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
